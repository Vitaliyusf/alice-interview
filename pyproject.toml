[project]
name = "alice-interview"
version = "0.1.0"
description = "Sitemap builder: an LLM agent on the OpenAI Responses API picks the pages, Playwright loads them."
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
